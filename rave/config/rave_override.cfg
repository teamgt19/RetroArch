# RAVE's RetroArch: settings RAVE forces on every launch (--appendconfig, replaces the old fork's emuvr_override.cfg).
# Merged 2026-10-01 from emuvr_override.cfg (E:\RAVE\RetroArch). Changed vs the fork: d3d11 + vsync, not threaded (CPU,
# Smooth Motion work); rave input/joypad drivers (VRCMD); wasapi (xaudio crossfeeds on some PCs); no Panning.dsp (PAN is
# built in); no NTSC GL shader (Spout sends the core's raw frame); netplay_stateless_mode dropped (gone upstream);
# aspect_ratio_index 21 -> 22 = "Core" (upstream added 21:9 - VERIFY the fork meant Core).

# Video
video_driver = "d3d11"
video_vsync = "true"
video_swap_interval = "1"
video_threaded = "false"
vrr_runloop_enable = "false"
video_fullscreen = "false"
# a whole number: this RetroArch reads "1.000000" as invalid and kept retroarch.cfg's 3 (window 1080 high)
video_scale = "1"
video_scale_integer = "true"
# off: the game's rectangle is sent at the core's own size (point sampled) - smoothing would blend the pixel edges in
video_smooth = "false"
video_crop_overscan = "true"
video_shader_enable = "false"
video_font_enable = "false"
video_font_size = "11"
video_message_color = "00ff00"
aspect_ratio_index = "22"

# Input (VRCMD over stdin)
input_driver = "rave"
input_joypad_driver = "rave"
input_overlay_enable = "false"
stdin_cmd_enable = "true"
input_libretro_device_p1 = "1"
input_libretro_device_p2 = "1"
input_libretro_device_p3 = "1"
input_libretro_device_p4 = "1"
input_libretro_device_p5 = "1"
input_libretro_device_p6 = "1"
input_libretro_device_p7 = "1"
input_libretro_device_p8 = "1"
# eight players, each on its own RAVE pad (RAVE_MAX_PORTS 8): the game sends P1..P8
input_max_users = "8"
input_player1_joypad_index = "0"
input_player2_joypad_index = "1"
input_player3_joypad_index = "2"
input_player4_joypad_index = "3"
input_player5_joypad_index = "4"
input_player6_joypad_index = "5"
input_player7_joypad_index = "6"
input_player8_joypad_index = "7"
input_player1_analog_dpad_mode = "1"
input_player2_analog_dpad_mode = "1"
input_player3_analog_dpad_mode = "1"
input_player4_analog_dpad_mode = "1"
input_player5_analog_dpad_mode = "1"
input_player6_analog_dpad_mode = "1"
input_player7_analog_dpad_mode = "1"
input_player8_analog_dpad_mode = "1"
input_game_focus_toggle = "scroll_lock"
input_menu_toggle_gamepad_combo = "4"
input_audio_mute = "nul"
input_cheat_index_minus = "nul"
input_cheat_index_plus = "nul"
input_cheat_toggle = "nul"
input_exit_emulator = "nul"
input_frame_advance = "nul"
input_hold_slowmotion = "nul"
input_reset = "nul"
input_rewind = "nul"
input_shader_next = "nul"
input_shader_prev = "nul"
input_toggle_fast_forward = "nul"
input_toggle_fullscreen = "nul"
input_volume_down = "nul"
input_volume_up = "nul"
input_player1_gun_aux_a = "z"
input_player1_gun_aux_a_btn = "2"
input_player1_gun_aux_b = "x"
input_player1_gun_aux_b_btn = "1"
input_player1_gun_aux_c = "a"
input_player1_gun_aux_c_btn = "3"
input_player1_gun_dpad_down = "down"
input_player1_gun_dpad_down_btn = "h0down"
input_player1_gun_dpad_left = "left"
input_player1_gun_dpad_left_btn = "h0left"
input_player1_gun_dpad_right = "right"
input_player1_gun_dpad_right_btn = "h0right"
input_player1_gun_dpad_up = "up"
input_player1_gun_dpad_up_btn = "h0up"
input_player1_gun_offscreen_shot = "nul"
input_player1_gun_offscreen_shot_btn = "nul"
input_player1_gun_select = "rshift"
input_player1_gun_select_btn = "7"
input_player1_gun_start = "enter"
input_player1_gun_start_btn = "6"
input_player1_gun_trigger = "nul"
input_player1_gun_trigger_btn = "nul"
input_player1_gun_trigger_mbtn = "1"

# Audio (positional only: silent until the game's first PAN)
audio_driver = "wasapi"
midi_driver = "null"

# Netplay
netplay_allow_slaves = "true"
netplay_require_slaves = "false"
netplay_check_frames = "0"
netplay_input_latency_frames_min = "1"
netplay_input_latency_frames_range = "5"
netplay_nat_traversal = "false"
netplay_public_announce = "false"
netplay_start_as_spectator = "true"

# Frontend
autosave_interval = "10"
builtin_mediaplayer_enable = "true"
cache_directory = ":\temp_cache"
config_save_on_exit = "false"
load_dummy_on_core_shutdown = "false"
log_verbosity = "true"
menu_mouse_enable = "false"
menu_unified_controls = "false"
pause_nonactive = "false"
rewind_enable = "false"
rgui_browser_directory = ":\..\Games"
rgui_show_start_screen = "false"

# From EmuVR's retroarch.cfg (Mike 2026-10-10: "we def want to port over all 4"; _tools/retroarch_config_compare.py).
# 1. EmuVR's keyboard layout for player 1 (WASD, keypad buttons, arrows = left stick)
input_player1_a = "keypad2"
input_player1_b = "keypad1"
input_player1_down = "s"
input_player1_l = "keypad3"
input_player1_l2 = "keypad."
input_player1_l3 = "keypad0"
input_player1_l_x_minus = "left"
input_player1_l_x_plus = "right"
input_player1_l_y_minus = "up"
input_player1_l_y_plus = "down"
input_player1_left = "a"
input_player1_r = "keypad6"
input_player1_r2 = "keypad9"
input_player1_r3 = "keypad8"
input_player1_right = "d"
input_player1_up = "w"
input_player1_x = "keypad5"
input_player1_y = "keypad4"
# 2. saves straight in the saves / states folders, as EmuVR had them (old EmuVR saves are found)
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
# 3. netplay: players on one device share digital / analog input, as in EmuVR
netplay_share_digital = "1"
netplay_share_analog = "1"
# 4. EmuVR's state slot, no savestate thumbnails, 59.94 Hz
state_slot = "-1"
savestate_thumbnail_enable = "false"
video_refresh_rate = "59.940060"
